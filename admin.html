<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel</title><style>body{font:16px Arial;background:#070b11;color:#fff;padding:20px}.wrap{max-width:850px;margin:auto}.card{background:#101722;border:1px solid #243044;border-radius:15px;padding:16px;margin:12px 0}input,button{padding:12px;border-radius:9px}button{background:#20d080;border:0;font-weight:bold}.pending{border-left:4px solid #f3c644}.paid{border-left:4px solid #20d080}</style></head><body><div class="wrap"><h1>🔐 Painel administrativo</h1><div class="card"><input id="pass" type="password" placeholder="Senha"><button onclick="load()">Entrar</button></div><div id="list"></div></div><script>let token='';async function load(){token=pass.value;let r=await fetch('/api/admin/orders',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)return alert(d.error);list.innerHTML=d.map(o=>`<div class="card ${o.status==='pago'?'paid':'pending'}"><b>${o.name}</b><br>CPF: ${o.cpf}<br>WhatsApp: ${o.whatsapp}<br>Quantidade: ${o.quantity}<br>Status: ${o.status}<br>${o.status==='pago'?'<p>Números: '+o.numbers.join(', ')+'</p>':`<button onclick="confirmar('${o.id}')">Confirmar pagamento e liberar números</button>`}</div>`).join('')}async function confirmar(id){if(!confirm('Você conferiu o Pix?'))return;let r=await fetch('/api/admin/orders/'+id+'/confirm',{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();alert(d.whatsapp?.sent?'Confirmado e enviado pelo WhatsApp.':'Confirmado. WhatsApp ainda não configurado.');load()}</script></body></html>
