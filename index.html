<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prêmio dos Gêmeos</title><style>body{margin:0;background:#070b11;color:#f5f7fb;font:16px Arial}.wrap{max-width:850px;margin:auto;padding:20px}.card{background:#101722;border:1px solid #243044;border-radius:20px;padding:22px;margin:16px 0}h1{font-size:38px}.gold{color:#f3c644}button{padding:14px;border:1px solid #243044;border-radius:12px;background:#172131;color:white;font-weight:bold;margin:5px}input{width:100%;box-sizing:border-box;padding:14px;margin:7px 0 12px;border-radius:10px;border:1px solid #243044;background:#0b111b;color:#fff}.primary{background:#20d080;color:#03140b;width:100%}.grid{display:grid;grid-template-columns:repeat(2,1fr)}small{color:#a9b3c2}</style></head><body><div class="wrap"><div class="card"><h1>PRÊMIO DOS <span class="gold">GÊMEOS</span></h1><p>🚙 Toyota SW4 + <b class="gold">R$ 2.000.000</b></p></div><div class="card"><h2>🎟️ Escolha suas combinações</h2><div class="grid"><button onclick="setQ(5)">5 · R$ 5</button><button onclick="setQ(10)">10 · R$ 10</button><button onclick="setQ(25)">25 · R$ 25</button><button onclick="setQ(50)">50 · R$ 50</button></div><p><button onclick="chg(-5)">−</button><b id="q">5</b> combinações <button onclick="chg(5)">+</button></p><p>Total: <b id="t">R$ 5,00</b></p></div><div class="card"><h2>👤 Cadastro</h2><label>Nome</label><input id="name" placeholder="Nome completo"><label>CPF</label><input id="cpf" placeholder="CPF"><label>WhatsApp</label><input id="wa" placeholder="(00) 00000-0000"><small>O WhatsApp informado receberá as combinações depois da confirmação do pagamento.</small></div><div class="card"><h2>💠 Pix manual</h2><p>Chave Pix: <b id="pix">carregando...</b></p><button class="primary" onclick="order()">Registrar pedido</button><p id="msg"></p></div></div><script>let q=5;const $=id=>document.getElementById(id),money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function render(){$('q').textContent=q;$('t').textContent=money(q)}function setQ(n){q=n;render()}function chg(n){q=Math.max(5,Math.min(500,q+n));render()}async function order(){let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,cpf:$('cpf').value,whatsapp:$('wa').value,quantity:q})}),d=await r.json();$('msg').textContent=r.ok?'Pedido registrado: '+d.id+' — faça o Pix e aguarde a confirmação.':d.error}fetch('/api/config').then(r=>r.json()).then(x=>$('pix').textContent=x.pixKey);render()</script></body></html>
